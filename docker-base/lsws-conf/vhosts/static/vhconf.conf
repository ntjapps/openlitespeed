  docRoot                 $VH_ROOT/public/
  enableGzip              1

  errorlog  {
    useServer             1
  }

  accesslog  {
    useServer             1
  }

  index  {
    useServer             1
  }

  expires  {
    useServer             1
  }

  accessControl  {
    allow                 *
  }

  context / {
    location              $DOC_ROOT/
    allowBrowse           1
  }

  rewrite  {
    enable                1
    autoLoadHtaccess      0
    logLevel              0
    rules                 <<<END_rules
# Path filtering (see README "Path filtering"). Vhost-level rules run before the .htaccess context rules.
# 1. dotfiles / dot-directories (.env, .git/, .htaccess, a/.hidden) except /.well-known/ (a dot segment inside it is still blocked)
RewriteRule ^(?!/*\.well-known(?:/[^/.][^/]*)*/?$).*(?:^|/)\. - [R=404,L]
# 2. this vhost never runs scripts (enableScript 0), so any PHP-like file would be served as source
RewriteRule \.(php[0-9]?|phtml|phar|phps|inc)(/|$) - [NC,R=404,L]
# 3. build/dependency/backup files that never belong in a docroot
RewriteRule (^|/)(composer\.(json|lock)|package(-lock)?\.json|installed\.json|artisan)$ - [NC,R=404,L]
RewriteRule \.(sql|bak|old|orig|swp|log|sh|ini)$ - [NC,R=404,L]
END_rules
  }