  docRoot                 $VH_ROOT/public/
  enableGzip              1

  errorlog  {
    useServer             1
  }

  accesslog  {
    useServer             1
  }

  index  {
    useServer             1
  }

  expires  {
    useServer             1
  }

  accessControl  {
    allow                 *
  }

  context / {
    location              $DOC_ROOT/
    allowBrowse           1

    rewrite  {
RewriteFile .htaccess
    }
  }

  rewrite  {
    enable                1
    autoLoadHtaccess      1
    logLevel              0
    rules                 <<<END_rules
# Path filtering (see README "Path filtering"). Vhost-level rules run before the .htaccess context rules.
# 1. dotfiles / dot-directories (.env, .git/, .htaccess, a/.hidden) except /.well-known/ (a dot segment inside it is still blocked)
RewriteRule ^(?!/*\.well-known(?:/[^/.][^/]*)*/?$).*(?:^|/)\. - [R=404,L]
# 2. PHP-like files under /vendor/
RewriteRule ^/*vendor/.*\.(php[0-9]?|phtml|phar|phps|inc)(/|$) - [NC,R=404,L]
# 3. build/dependency/backup files that never belong in a docroot
RewriteRule (^|/)(composer\.(json|lock)|package(-lock)?\.json|installed\.json|artisan)$ - [NC,R=404,L]
RewriteRule \.(sql|bak|old|orig|swp|log|sh|ini)$ - [NC,R=404,L]
# 4. front-controller mode: only /index.php executes. Off by default (the two lines below are commented out);
#    entrypoint.sh uncomments them when OLS_PHP_ENTRYPOINT_ONLY=1 and comments them out again otherwise.
#    entrypoint.sh finds the two lines by the regexp comment group inside their patterns: keep it.
#RewriteCond %{REQUEST_URI} !^/+(?#phpentry)index\.php(/|$)
#RewriteRule (?#phpentry)\.(php[0-9]?|phtml|phar|phps|inc)(/|$) - [NC,R=404,L]
END_rules
  }